server {
  listen 80;
  root /usr/share/nginx/html;

  # API e tokens de desenvolvimento no mesmo domínio (sem CORS em produção).
  location /dev/ { proxy_pass http://api:8080; }
  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

  location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
  location = /ngsw.json { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
